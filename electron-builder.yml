appId: LumaPlayer.exe
productName: Luma Player
executableName: LumaPlayer
asar: true
electronLanguages:
  - ru
  - en-US
directories:
  output: release
  buildResources: Assets
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
asarUnpack:
  - dist/demo/*.mp3
extraResources:
  - from: dist-native
    to: audio
    filter: [LumaFloat.exe]
  - from: dist-native
    to: security
    filter: [LumaVerify.exe]
win:
  icon: Assets/icon.ico
  target:
    - nsis
    - portable
nsis:
  include: Assets/installer.nsh
  # Preserve the upgrade/uninstall identity of app.lumaplayer.desktop.
  guid: 05d31eca-e044-513b-8c10-678775f8445d
  shortcutName: Luma Player
  installerLanguages:
    - ru_RU
  language: '1049'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: 'Luma-Player-Setup-${version}-${arch}.${ext}'
portable:
  artifactName: 'Luma-Player-Portable-${version}-${arch}.${ext}'
