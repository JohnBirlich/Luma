appId: app.lumaplayer.desktop
productName: Luma Player
asar: true
electronLanguages:
  - ru
  - en-US
directories:
  output: release
  buildResources: Assets
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
asarUnpack:
  - dist/demo/*.mp3
win:
  icon: Assets/icon.ico
  target:
    - nsis
    - portable
nsis:
  installerLanguages:
    - ru_RU
  language: '1049'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: 'Luma-Player-Setup-${version}-${arch}.${ext}'
portable:
  artifactName: 'Luma-Player-Portable-${version}-${arch}.${ext}'
