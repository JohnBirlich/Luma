name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_catalog:
        description: 'Also check playback from the public music catalogs (requires network access)'
        type: boolean
        default: false
      live_radio:
        description: 'Probe response, audio decode and artwork from the curated live radio providers (no release artifact)'
        type: boolean
        default: false
      live_services:
        description: 'Probe live metadata, thumbnail and lyrics endpoints (no release artifact)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}${{ inputs.live_radio && '-live-radio' || inputs.live_catalog && '-live-catalog' || inputs.live_services && '-live-services' || '' }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm test
        run: |
          $log = Join-Path $env:RUNNER_TEMP luma-unit.log
          npm test | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Select-String -Path $log -Pattern '^not ok ' | ForEach-Object {
              Write-Output ("::error title=Unit test::" + $_.Line.Replace('%', '%25'))
            }
          }
          exit $result
      - run: npm run build
      - name: Desktop smoke
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          npm run test:desktop 2>&1 | tee smoke.log || {
            status=$?
            grep -aA3 -E 'Timed out|AssertionError|not ok ' smoke.log | tr -d '\r' | tail -n 40 | while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done
            exit $status
          }
        env:
          LUMA_LIVE_CATALOG: ${{ inputs.live_catalog && '1' || '0' }}
          LUMA_LIVE_RADIO: ${{ inputs.live_radio && '1' || '0' }}
          LUMA_LIVE_SERVICES: ${{ inputs.live_services && '1' || '0' }}
      - run: npm run test:installed -- --preflight
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
      - run: npm run package:win
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
      - run: npm run test:package
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
      - name: Fetch the published v1.4.0 upgrade fixture
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.4.0 --repo ${{ github.repository }} --pattern Luma-Player-Setup-1.4.0-x64.exe --dir "$env:RUNNER_TEMP"
      - run: npm run test:installed
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
        env:
          LUMA_SMOKE_LEGACY_SETUP: ${{ runner.temp }}/Luma-Player-Setup-1.4.0-x64.exe
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.live_radio && !inputs.live_catalog && !inputs.live_services }}
        with:
          name: Luma-Windows-x64
          path: release/*.exe
          if-no-files-found: error
