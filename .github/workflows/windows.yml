name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_catalog:
        description: 'Also check playback from the public music catalogs (requires network access)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
        env:
          LUMA_LIVE_CATALOG: ${{ inputs.live_catalog && '1' || '0' }}
      - run: npm run package:win
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-Player-Windows-x64
          path: release/*.exe
          if-no-files-found: error
