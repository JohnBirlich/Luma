name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_catalog:
        description: 'Also check playback from the public music catalogs (requires network access)'
        type: boolean
        default: false
      live_radio:
        description: 'Probe response, audio decode and artwork from the curated live radio providers (no release artifact)'
        type: boolean
        default: false
      live_services:
        description: 'Check the live Apple Music, MusicBrainz and LRCLIB endpoints'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}${{ inputs.live_radio && '-live-radio' || inputs.live_catalog && '-live-catalog' || '' }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
        env:
          LUMA_LIVE_CATALOG: ${{ inputs.live_catalog && '1' || '0' }}
          LUMA_LIVE_RADIO: ${{ inputs.live_radio && '1' || '0' }}
          LUMA_LIVE_SERVICES: ${{ inputs.live_services && '1' || '0' }}
      - run: npm run test:installed -- --preflight
        if: ${{ !inputs.live_radio && !inputs.live_catalog }}
      - run: npm run package:win
        if: ${{ !inputs.live_radio && !inputs.live_catalog }}
      - run: npm run test:package
        if: ${{ !inputs.live_radio && !inputs.live_catalog }}
      - run: npm run test:installed
        if: ${{ !inputs.live_radio && !inputs.live_catalog }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.live_radio && !inputs.live_catalog }}
        with:
          name: Luma-Player-Windows-x64
          path: release/*.exe
          if-no-files-found: error
